# Argo Events Sensor that fires on pushes to quintauris-tech/rvbl_core main
# and on pull requests targeting main.
#
# A single dependency accepts both event types; all branch/action filtering is
# done in the Lua script. Duplicate runs are prevented by a deterministic workflow
# name derived from the commit SHA (409 Already Exists as at-most-once guard).
apiVersion: argoproj.io/v1alpha1
kind: Sensor
metadata:
  name: rvbl-parent-push-sensor
  namespace: argo-events
spec:
  eventBusName: default
  template:
    serviceAccountName: argo-events-sa
  dependencies:
    - name: parent-push
      eventSourceName: github-eventsource
      eventName: github
      filters:
        data:
          - path: body.repository.full_name
            type: string
            value:
              - "quintauris-tech/rvbl_core"
          - path: header.X-Github-Event
            type: string
            value:
              - push
              - pull_request
        script: |-
          if event.body.pull_request ~= nil then
            -- pull_request event: targeting main, actions opened/synchronize/reopened
            local base = event.body.pull_request.base and event.body.pull_request.base.ref
            if base ~= "main" then return false end
            local action = event.body.action
            return action == "opened" or action == "synchronize" or action == "reopened"
          end
          -- push event: main branch only; skip commits that only touch .argo/
          if event.body.ref == nil then return false end
          if event.body.ref ~= "refs/heads/main" then return false end
          if event.body.commits == nil then return true end
          for _, commit in ipairs(event.body.commits) do
            for _, key in ipairs({"modified", "added", "removed"}) do
              local files = commit[key]
              if files ~= nil then
                for _, f in ipairs(files) do
                  if string.sub(f, 1, 6) ~= ".argo/" then
                    return true
                  end
                end
              end
            end
          end
          return false

  triggers:
    - template:
        name: build
        conditions: parent-push
        k8s:
          operation: create
          source:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                name: ""
                namespace: rvbl-core-workflows
              spec:
                workflowTemplateRef:
                  name: rvbl-core-build
                serviceAccountName: argo-workflow-sa
                volumeClaimGC:
                  strategy: OnWorkflowCompletion
                arguments:
                  parameters:
                    - name: repository
                      value: ""
                    - name: ref
                      value: ""
                    - name: sha
                      value: ""
                    - name: branch
                      value: ""
          parameters:
            - src:
                dependencyName: parent-push
                dataTemplate: '{{if .Input.body.pull_request}}{{.Input.body.pull_request.head.repo.full_name}}{{else}}{{.Input.body.repository.full_name}}{{end}}'
              dest: spec.arguments.parameters.0.value
            - src:
                dependencyName: parent-push
                dataTemplate: '{{if .Input.body.pull_request}}{{.Input.body.pull_request.head.ref}}{{else}}{{.Input.body.ref}}{{end}}'
              dest: spec.arguments.parameters.1.value
            - src:
                dependencyName: parent-push
                dataTemplate: '{{if .Input.body.pull_request}}{{.Input.body.pull_request.head.sha}}{{else}}{{.Input.body.after}}{{end}}'
              dest: spec.arguments.parameters.2.value
            - src:
                dependencyName: parent-push
                dataTemplate: '{{if .Input.body.pull_request}}{{.Input.body.pull_request.head.ref}}{{else}}{{trimPrefix "refs/heads/" .Input.body.ref}}{{end}}'
              dest: spec.arguments.parameters.3.value
            - src:
                dependencyName: parent-push
                dataTemplate: '{{if .Input.body.pull_request}}rvbl-core-build-{{.Input.body.pull_request.head.sha}}{{else}}rvbl-build-gnu-gcc-{{.Input.body.after}}{{end}}'
              dest: metadata.name
