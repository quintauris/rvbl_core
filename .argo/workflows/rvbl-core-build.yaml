apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: rvbl-core-build
  namespace: rvbl-core-workflows
spec:
  entrypoint: main
  parallelism: 2
  archiveLogs: true
  podGC:
    strategy: OnPodCompletion
    deleteDelayDuration: 1h
  volumeClaimGC:
    strategy: OnWorkflowCompletion
  hooks:
    running:   { expression: workflow.status == "Running",   template: update-github-status }
    succeeded: { expression: workflow.status == "Succeeded", template: update-github-status }
    failed:    { expression: workflow.status == "Failed",    template: update-github-status }
    error:     { expression: workflow.status == "Error",     template: update-github-status }
  arguments:
    parameters:
      - name: repository
        default: quintauris-tech/rvbl_core
        description: Repository in format owner/repo
      - name: ref
        default: ""
        description: Git ref (e.g., refs/heads/main)
      - name: sha
        default: ""
        description: Git commit SHA
      - name: branch
        default: main
        description: Branch name
      - name: event_type
        default: ""
        description: "Event kind: push | pull_request | workflow_dispatch | tag"
  serviceAccountName: argo-workflow-sa
  volumeClaimTemplates:
    - metadata:
        name: workspace
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
        storageClassName: local-path

  templates:
    - name: main
      steps:
        - - name: checkout
            arguments:
              parameters:
                - name: repository
                  value: "{{workflow.parameters.repository}}"
                - name: ref
                  value: "{{workflow.parameters.ref}}"
                - name: sha
                  value: "{{workflow.parameters.sha}}"
                - name: branch
                  value: "{{workflow.parameters.branch}}"
                - name: workspace-path
                  value: /workspace
                - name: checkout-dir
                  value: core
            templateRef:
              name: git-checkout-base
              template: git-checkout
              clusterScope: true
        - - name: build
            template: cargo-build
            arguments: {}
        - - name: test
            template: cargo-test
            arguments: {}
        - - name: archive
            template: tools-archive
            arguments: {}

    - name: cargo-build
      container:
        name: rust
        image: rust:1.90
        command: [bash, -ceu]
        args:
          - |
            cargo build --release \
              --target-dir build \
              --manifest-path core/tool/Cargo.toml
        workingDir: /work
        volumeMounts:
          - name: workspace
            mountPath: /work

    - name: cargo-test
      container:
        name: rust
        image: rust:1.90
        command: [bash, -ceu]
        args:
          - |
            cargo test \
              --target-dir build \
              --manifest-path core/tool/Cargo.toml
        workingDir: /work
        volumeMounts:
          - name: workspace
            mountPath: /work

    - name: tools-archive
      outputs:
        artifacts:
          - name: rvbl-tools
            path: /work/build/release/tools.tgz
            s3:
              key: "rvbl-core-tools/{{workflow.parameters.branch}}/tools.tgz"
            archive:
              none: {}
      container:
        image: alpine:latest
        command: [sh, -c]
        args:
          - |
            cd build/release
            x=$(find . -maxdepth 1 -type f -exec test -x {} \; -exec echo {} \;)
            tar -czf tools.tgz $x
        workingDir: /work
        volumeMounts:
          - name: workspace
            mountPath: /work

    - name: update-github-status
      steps:
        - - name: update-status
            templateRef:
              name: github-status-base
              template: update-github-status
              clusterScope: true
            arguments:
              parameters:
                - name: repository
                  value: "{{workflow.parameters.repository}}"
                - name: sha
                  value: "{{workflow.parameters.sha}}"
                - name: workflow-name
                  value: "{{workflow.name}}"
                - name: workflow-namespace
                  value: "{{workflow.namespace}}"
                - name: context
                  value: "ci/rvbl-core-workflows/rvbl-core-build"
                - name: workflow-ui-base-url
                  value: "https://argo-workflows.quintauris.com"
                - name: workflow-status
                  value: "{{workflow.status}}"
