[package]
name = "rvbl_model"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.5.58", features = ["derive"] }
colog = "1.4.0"
env = "1.0.1"
eval = "0.4.3"
jsonschema = "0.33.0"
log = "0.4.29"
regex = "1.11.2"
regex_static = "0.1.1"
serde = "1.0.228"
serde_json = "1.0.145"

[[bin]]
name = "parser"
path = "program.rs"

[lib]
name = "rvbl_model"
path = "lib.rs"
